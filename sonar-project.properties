sonar.projectKey=Eric-Juquel_devboard-claude-skill-test
sonar.organization=Eric-Juquel

# Sources
sonar.sources=devboard-front/src,devboard-back/src

# Tests
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  devboard-front/src/api/model/**,\
  devboard-front/src/api/services/generated/**

# Coverage reports (generated by test:cov)
sonar.typescript.lcov.reportPaths=\
  devboard-front/coverage/lcov.info,\
  devboard-back/coverage/lcov.info

sonar.sourceEncoding=UTF-8
